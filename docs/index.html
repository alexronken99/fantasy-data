<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sala de Mercado — LaLiga Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-deep:#0E2E23;
    --pitch-mid:#153B2C;
    --pitch-line:#254D3B;
    --turf:#5BC17A;
    --turf-dim:#3D8558;
    --chalk:#E9ECE5;
    --chalk-dim:#9FB3A8;
    --amber:#E3A83B;
    --alert:#D9574A;
    --panel:#102A21;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--pitch-deep);color:var(--chalk);font-family:'Inter',sans-serif;}
  body{
    background-image:
      repeating-linear-gradient(0deg, rgba(233,236,229,0.025) 0px, rgba(233,236,229,0.025) 1px, transparent 1px, transparent 64px),
      radial-gradient(ellipse at top, #123526 0%, var(--pitch-deep) 60%);
    min-height:100vh;
  }
  .display{font-family:'Teko',sans-serif; font-weight:600; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .ticker-wrap{
    border-bottom:1px solid var(--pitch-line);
    background:var(--panel);
    overflow:hidden;
    white-space:nowrap;
    padding:8px 0;
  }
  .ticker{display:inline-block; padding-left:100%; animation:scroll 38s linear infinite;}
  .ticker-wrap:hover .ticker{animation-play-state:paused;}
  @keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
  .tick-item{display:inline-flex; align-items:baseline; gap:6px; margin-right:36px; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .tick-item .name{color:var(--chalk-dim);}
  .tick-up{color:var(--turf);}
  .tick-down{color:var(--alert);}

  header{padding:28px 32px 10px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand h1{
    font-size:52px; line-height:0.85; margin:0; text-transform:uppercase;
    color:var(--chalk);
  }
  .brand h1 span{color:var(--turf);}
  .brand p{margin:6px 0 0; color:var(--chalk-dim); font-size:13px; letter-spacing:0.04em; text-transform:uppercase;}
  .status{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--chalk-dim); text-align:right;}
  .status b{color:var(--amber);}

  .layout{display:grid; grid-template-columns:88px 1fr 340px; gap:0; padding:0 32px 40px; align-items:start;}
  @media (max-width:1000px){ .layout{grid-template-columns:1fr; } .rail{flex-direction:row; overflow-x:auto;} .radar-panel{order:3;} }

  .rail{display:flex; flex-direction:column; gap:10px; position:sticky; top:20px; padding-top:20px;}
  .rail button{
    background:var(--panel); border:1px solid var(--pitch-line); color:var(--chalk-dim);
    font-family:'Teko',sans-serif; font-size:22px; letter-spacing:0.05em;
    border-radius:10px; padding:10px 0; cursor:pointer; text-transform:uppercase;
    writing-mode:horizontal-tb;
  }
  .rail button.active{ background:var(--turf-dim); color:var(--pitch-deep); border-color:var(--turf); font-weight:700;}
  .rail button:hover{ border-color:var(--turf); color:var(--chalk);}

  .main{padding:20px 24px;}
  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=text]{
    flex:1; min-width:180px; background:var(--panel); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:10px 14px; border-radius:8px; font-family:'Inter',sans-serif; font-size:14px;
  }
  .toolbar select{
    background:var(--panel); border:1px solid var(--pitch-line); color:var(--chalk);
    padding:10px 12px; border-radius:8px; font-family:'Inter',sans-serif; font-size:13px;
  }
  .count{color:var(--chalk-dim); font-size:12px; font-family:'JetBrains Mono',monospace;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead th{
    text-align:left; font-family:'Teko',sans-serif; font-size:16px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--chalk-dim); border-bottom:1px solid var(--pitch-line); padding:8px 10px; cursor:pointer; user-select:none;
  }
  thead th:hover{color:var(--turf);}
  tbody tr{border-bottom:1px solid rgba(37,77,59,0.5);}
  tbody tr:hover{background:rgba(91,193,122,0.06);}
  td{padding:10px; vertical-align:middle;}
  .pname{font-weight:600;}
  .pteam{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--pitch-deep);
    background:var(--chalk-dim); padding:2px 6px; border-radius:4px; margin-left:8px; letter-spacing:0.03em;
  }
  .pval{font-family:'JetBrains Mono',monospace; font-weight:600;}
  .ppts{font-family:'JetBrains Mono',monospace; color:var(--chalk-dim);}
  .trend{font-family:'JetBrains Mono',monospace; font-size:12px;}
  .trend.up{color:var(--turf);}
  .trend.down{color:var(--alert);}
  .trend.flat{color:var(--chalk-dim);}
  .track-btn{
    background:transparent; border:1px solid var(--pitch-line); color:var(--chalk-dim); border-radius:6px;
    padding:5px 10px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
  }
  .track-btn:hover{border-color:var(--amber); color:var(--amber);}
  .status-flag{font-size:10px; padding:2px 6px; border-radius:4px; margin-left:6px; text-transform:uppercase; font-family:'Inter',sans-serif; font-weight:600;}
  .status-injured{background:rgba(217,87,74,0.18); color:var(--alert);}
  .status-doubtful, .status-suspended{background:rgba(227,168,59,0.18); color:var(--amber);}

  .radar-panel{padding:20px 0 20px 24px; position:sticky; top:20px;}
  .radar-panel h2{font-size:26px; margin:0 0 4px; text-transform:uppercase; letter-spacing:0.03em;}
  .radar-panel .sub{color:var(--chalk-dim); font-size:12px; margin-bottom:16px;}
  .radar-card{
    background:var(--panel); border:1px solid var(--pitch-line); border-radius:12px; padding:14px; margin-bottom:12px;
    display:flex; gap:12px; align-items:center;
  }
  .ring{position:relative; width:56px; height:56px; flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700;
  }
  .radar-info{flex:1; min-width:0;}
  .radar-info .rname{font-weight:600; font-size:14px;}
  .radar-info .rrival{color:var(--amber); font-size:12px; font-family:'JetBrains Mono',monospace;}
  .radar-info .rval{color:var(--chalk-dim); font-size:12px; font-family:'JetBrains Mono',monospace; margin-top:2px;}
  .rm-btn{background:none; border:none; color:var(--chalk-dim); cursor:pointer; font-size:16px; flex:none;}
  .rm-btn:hover{color:var(--alert);}
  .empty-radar{color:var(--chalk-dim); font-size:13px; border:1px dashed var(--pitch-line); border-radius:10px; padding:18px; text-align:center;}

  .overlay{position:fixed; inset:0; background:rgba(6,18,14,0.75); display:none; align-items:center; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--pitch-line); border-radius:14px; padding:24px; width:340px;}
  .modal h3{margin:0 0 4px; font-size:24px; text-transform:uppercase; font-family:'Teko',sans-serif;}
  .modal p.mp-team{color:var(--chalk-dim); font-size:12px; margin:0 0 16px;}
  .modal label{display:block; font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.04em; margin:12px 0 4px;}
  .modal input{width:100%; background:var(--pitch-deep); border:1px solid var(--pitch-line); color:var(--chalk); padding:9px 10px; border-radius:8px; font-family:'Inter',sans-serif;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{flex:1; background:var(--turf); color:var(--pitch-deep); border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer; text-transform:uppercase; font-size:13px; letter-spacing:0.03em;}
  .btn-secondary{background:none; border:1px solid var(--pitch-line); color:var(--chalk-dim); padding:10px 14px; border-radius:8px; cursor:pointer;}
  .loading{padding:60px; text-align:center; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace;}

  .view-tabs{display:flex; gap:8px; padding:0 32px; margin-top:14px;}
  .view-tabs button{
    background:var(--panel); border:1px solid var(--pitch-line); border-bottom:none; color:var(--chalk-dim);
    font-family:'Teko',sans-serif; font-size:20px; letter-spacing:0.04em; text-transform:uppercase;
    padding:8px 22px; border-radius:8px 8px 0 0; cursor:pointer;
  }
  .view-tabs button.active{ background:var(--turf-dim); color:var(--pitch-deep); font-weight:700; border-color:var(--turf);}
  .view-tabs button:hover:not(.active){ color:var(--chalk); }
  .view-full{padding:16px 32px 40px;}

  .mkt-alert{background:rgba(217,87,74,0.12);}
  .mkt-soon{background:rgba(227,168,59,0.10);}
  .diff-pos{color:var(--turf); font-weight:600;}
  .diff-neg{color:var(--alert); font-weight:600;}
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker" id="ticker"><span class="tick-item name">Cargando movimientos del mercado…</span></div></div>

<header>
  <div class="brand">
    <h1>Sala de <span>Mercado</span></h1>
    <p>LaLiga Fantasy · cláusulas &amp; protección de 14 días</p>
  </div>
  <div class="status" id="statusBox">conectando con el mercado…</div>
</header>

<nav class="view-tabs" id="viewTabs">
  <button data-view="jugadores" class="active">Jugadores</button>
  <button data-view="mercado">Mercado</but
